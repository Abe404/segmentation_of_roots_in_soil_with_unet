name: "mask2former-swin-base-coco"
method: grid  # or "random" for random search
parameters:
  model:
    value: sam
  encoder_name:
    value: vit-base
  pretrained_model:
    value: True
  learning_rate:
    value: 0.001  # List of learning rates to try
  batch_size:
    value: 4
  epochs:
    value: 80  # Fixed value for epochs
  repeats:
   values: [1, 2, 3] 

command:
  - python
  - nn/train.py
