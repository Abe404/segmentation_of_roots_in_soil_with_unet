name: "mask2former-swin-base-coco"
method: grid  # or "random" for random search
parameters:
  model:
    value: mask2former
  encoder_name:
    values: [swin-base-coco-instance, swin-tiny-coco-instance, swin-small-coco-instance, swin-base-coco-instance, swin-tiny-ade-semantic, swin-small-ade-semantic, swin-base-ade-semantic]
  learning_rate:
    value: 0.001  # List of learning rates to try
  batch_size:
    value: 4
  epochs:
    value: 80  # Fixed value for epochs
  repeats:
   values: [1, 2, 3] 

command:
  - python
  - nn/train.py
