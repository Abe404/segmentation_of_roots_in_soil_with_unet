name: "repeats_mask2former"
method: grid  # or "random" for random search
parameters:
  model:
    value: mask2former
  encoder_name:
    value: "swin-base-coco-instance"
  learning_rate:
    value: 0.001  # List of learning rates to try
  batch_size:
    value: 1  
  epochs:
    value: 80  # Fixed value for epochs
  repeats:
   values: [1, 2, 3] 

command:
  - python
  - nn/train.py
